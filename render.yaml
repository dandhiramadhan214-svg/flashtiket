services:
  # ─────────────────────────────────────────────────────────────
  # 1. Backend Web Service (Node.js + Express API)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: flashtiket-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MIDTRANS_IS_PRODUCTION
        value: "false"

  # ─────────────────────────────────────────────────────────────
  # 2. Frontend Static Site (Vue 3 + Vite SPA)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: flashtiket-frontend
    runtime: static
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
